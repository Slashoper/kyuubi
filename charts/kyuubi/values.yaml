# The value (templated string) is used for log4j2.xml file
  # See example at conf/log4j2.xml.template https://kyuubi.readthedocs.io/en/master/configuration/settings.html#logging for more details
  log4j2: |
    <?xml version="1.0" encoding="UTF-8"?>
      <Configuration status="WARN" monitorInterval="30">
      <!-- 定义 Appenders -->
      <Appenders>
      <!-- Console 输出 -->
      <Console name="Console" target="SYSTEM_OUT">
      <PatternLayout>
      <Pattern>%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n</Pattern>
      </PatternLayout>
      </Console>

      <!-- File 输出 -->
      <File name="File" fileName="logs/kyuubi.log" append="true">
      <PatternLayout>
      <Pattern>%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n</Pattern>
      </PatternLayout>
      </File>
      </Appenders>
      
      <!-- 定义 Loggers -->
      <Loggers>
      <!-- 设置全局日志级别 -->
      <Root level="DEBUG">
      <AppenderRef ref="Console"/>
      <AppenderRef ref="File"/>
      </Root>
      <!-- 针对特定包设置日志级别 -->
      <Logger name="org.apache.kyuubi" level="DEBUG" additivity="false">
      <AppenderRef ref="Console"/>
      </Logger>
      </Loggers>
      </Configuration>

